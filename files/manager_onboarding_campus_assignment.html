<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container relative">
<!-- Background Elements for Cyber Minimal Vibe -->
<div class="fixed inset-0 z-0 pointer-events-none overflow-hidden flex justify-center items-center opacity-30">
<div class="w-[800px] h-[800px] bg-primary/5 rounded-full blur-[100px] absolute top-[-200px] right-[-200px]"></div>
<div class="w-[600px] h-[600px] bg-secondary/5 rounded-full blur-[80px] absolute bottom-[-100px] left-[-100px]"></div>
</div>
<!-- Top Navigation (Onboarding - Minimal) -->
<nav class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 bg-surface/80 backdrop-blur-xl border-b border-outline-variant/30 shadow-sm">
<div class="flex items-center gap-sm cursor-pointer scale-95 active:opacity-80 transition-all">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
<span class="font-label-md text-label-md text-on-surface-variant hover:text-primary-container transition-colors">Back</span>
</div>
<div class="font-headline-md text-headline-md font-bold text-primary tracking-tight">SafeCampus</div>
<div class="w-8"></div> <!-- Spacer for centering -->
</nav>
<!-- Main Content Canvas -->
<main class="flex-grow z-10 flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop pt-24 pb-32">
<div class="w-full max-w-[600px] flex flex-col gap-lg">
<!-- Progress Indicator -->
<div class="flex flex-col gap-sm items-center w-full">
<span class="font-label-md text-label-md text-primary">Step 3 of 4</span>
<div class="flex gap-unit w-full max-w-[200px]">
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-primary rounded-full relative overflow-hidden">
<div class="absolute inset-0 bg-primary/20 animate-pulse"></div>
</div>
<div class="h-1 flex-1 bg-surface-container-high rounded-full"></div>
</div>
</div>
<!-- Header -->
<header class="text-center flex flex-col gap-sm mb-lg">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Campus Assignment</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[400px] mx-auto">Select the primary network node you are authorized to oversee. Verification required.</p>
</header>
<!-- Node Selection Grid -->
<div class="flex flex-col gap-md">
<!-- Node Card 1 (Selected State Example) -->
<label class="group relative flex items-center p-lg bg-surface-container/50 backdrop-blur-[20px] rounded-xl border border-primary/40 shadow-[0_4px_20px_rgba(0,112,255,0.15)] cursor-pointer transition-all hover:bg-surface-container">
<input checked="" class="peer sr-only" name="campus_node" type="radio"/>
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center border border-primary/30">
<span class="material-symbols-outlined text-primary" data-icon="hub">hub</span>
</div>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface text-[18px]">Lusaka Main</span>
<span class="font-label-md text-label-md text-primary mt-unit">Node Active • 14,203 Users</span>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-primary flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-primary scale-100 transition-transform"></div>
</div>
</div>
<!-- Cyber Selection Indicator -->
<div class="absolute inset-0 rounded-xl border-2 border-primary pointer-events-none"></div>
</label>
<!-- Node Card 2 (Unselected State) -->
<label class="group relative flex items-center p-lg bg-surface-container/30 backdrop-blur-[20px] rounded-xl border border-outline-variant/30 cursor-pointer transition-all hover:bg-surface-container/50 hover:border-outline-variant">
<input class="peer sr-only" name="campus_node" type="radio"/>
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-md opacity-80 group-hover:opacity-100 transition-opacity">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center border border-outline-variant/50">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="hub">hub</span>
</div>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface text-[18px]">Copperbelt</span>
<span class="font-label-md text-label-md text-on-surface-variant mt-unit">Node Active • 8,450 Users</span>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-colors group-hover:border-on-surface-variant">
<div class="w-3 h-3 rounded-full bg-transparent scale-0 transition-transform peer-checked:bg-primary peer-checked:scale-100"></div>
</div>
</div>
</label>
<!-- Node Card 3 (Unselected State) -->
<label class="group relative flex items-center p-lg bg-surface-container/30 backdrop-blur-[20px] rounded-xl border border-outline-variant/30 cursor-pointer transition-all hover:bg-surface-container/50 hover:border-outline-variant">
<input class="peer sr-only" name="campus_node" type="radio"/>
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-md opacity-80 group-hover:opacity-100 transition-opacity">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center border border-outline-variant/50">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="hub">hub</span>
</div>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface text-[18px]">Livingstone</span>
<span class="font-label-md text-label-md text-on-surface-variant mt-unit">Node Active • 3,120 Users</span>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-colors group-hover:border-on-surface-variant">
<div class="w-3 h-3 rounded-full bg-transparent scale-0 transition-transform peer-checked:bg-primary peer-checked:scale-100"></div>
</div>
</div>
</label>
</div>

<div class="mt-lg w-full">
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md py-4 px-lg rounded-xl transition-all relative group overflow-hidden">
<span class="relative z-10 flex items-center justify-center gap-sm">
<span class="material-symbols-outlined" data-icon="cable">cable</span>
                        Connect to Node
                    </span>
<!-- Hover Effect Border -->
<div class="absolute inset-[-4px] border border-primary opacity-0 group-hover:opacity-100 transition-opacity rounded-[16px] pointer-events-none"></div>
</button>
<div class="text-center mt-sm">
<span class="font-label-md text-label-md text-on-surface-variant text-[12px] flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[14px]" data-icon="lock">lock</span>
                        End-to-end encrypted connection
                    </span>
</div>
</div>
</div>
