<body class="text-on-surface antialiased min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop bg-[url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&amp;w=2564&amp;auto=format&amp;fit=crop')] bg-cover bg-center bg-no-repeat bg-fixed relative" data-alt="A dark, abstract digital background with subtle, deep blue and black fluid gradients. The scene is minimal and futuristic, representing a secure digital environment. Faint, glowing neon blue lines weave through the deep black void, establishing a cyber-minimal aesthetic. The overall mood is vigilant, calm, and highly technical, perfect for a high-security administrative interface.">
<div class="absolute inset-0 bg-[#050505]/90 backdrop-blur-3xl z-0"></div>
<main class="w-full max-w-[600px] z-10 flex flex-col gap-lg">
<!-- Header / Progress -->
<header class="flex flex-col items-center text-center gap-sm mb-sm">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Profile &amp; Credentials</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Step 2 of 4</p>
<div class="flex gap-2 mt-sm w-full max-w-[200px] justify-center">
<div class="h-1 flex-1 bg-primary rounded-full opacity-40"></div>
<div class="h-1 flex-1 bg-primary rounded-full shadow-[0_0_10px_rgba(176,198,255,0.5)]"></div>
<div class="h-1 flex-1 bg-surface-container-high rounded-full"></div>
<div class="h-1 flex-1 bg-surface-container-high rounded-full"></div>
</div>
</header>
<!-- Form Container -->
<section class="glass-panel rounded-xl p-lg md:p-xl flex flex-col gap-lg w-full">
<form class="flex flex-col gap-lg">
<!-- Full Name -->
<div class="flex flex-col gap-xs relative group">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-sm" for="fullName">
<span class="material-symbols-outlined text-[16px]">person</span>
                        Full Name
                    </label>
<input class="cyber-input bg-[#050505] border-t-0 border-l-0 border-r-0 border-b border-outline-variant/30 text-on-surface font-body-lg text-body-lg py-sm px-0 transition-all duration-300 w-full placeholder:text-on-surface-variant/50" id="fullName" placeholder="Enter your full legal name" type="text"/>
</div>
<!-- University ID -->
<div class="flex flex-col gap-xs relative group">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-sm" for="uniId">
<span class="material-symbols-outlined text-[16px]">badge</span>
                        University ID Number
                    </label>
<input class="cyber-input bg-[#050505] border-t-0 border-l-0 border-r-0 border-b border-outline-variant/30 text-on-surface font-body-lg text-body-lg py-sm px-0 transition-all duration-300 w-full placeholder:text-on-surface-variant/50" id="uniId" placeholder="e.g. SC-1029384" type="text"/>
</div>
<!-- Official Email -->
<div class="flex flex-col gap-xs relative group">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-sm" for="email">
<span class="material-symbols-outlined text-[16px]">mail</span>
                        Official Email
                    </label>
<input class="cyber-input bg-[#050505] border-t-0 border-l-0 border-r-0 border-b border-outline-variant/30 text-on-surface font-body-lg text-body-lg py-sm px-0 transition-all duration-300 w-full placeholder:text-on-surface-variant/50" id="email" placeholder="manager@university.edu" type="email"/>
</div>
<!-- ID Upload Area -->
<div class="flex flex-col gap-sm mt-sm">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-sm">
<span class="material-symbols-outlined text-[16px]">upload_file</span>
                        Staff ID Scan
                    </label>
<div class="border border-dashed border-outline-variant/50 rounded-lg bg-[#050505]/50 p-lg flex flex-col items-center justify-center text-center gap-sm cursor-pointer hover:border-primary/50 transition-colors group">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center group-hover:bg-primary/10 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_photo_alternate</span>
</div>
<div>
<p class="font-body-md text-body-md text-on-surface">Click to upload digital ID</p>
<p class="font-label-md text-label-md text-on-surface-variant mt-xs">JPEG, PNG or PDF (Max 5MB)</p>
</div>
</div>
</div>
</form>
</section>
<!-- Action Buttons -->
<div class="flex justify-between items-center mt-sm w-full">
<button class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface flex items-center gap-sm transition-colors py-sm px-md">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
                Back
            </button>
